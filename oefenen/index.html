<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oefenen met denk- en werkwijzen · biologie</title>
<style>
  :root {
    --ink: #14404A; --tekst: #1E2A32; --teal: #0F7C74; --teal-licht: #E3F0EE; --teal-mid: #CFE5E2;
    --koraal: #E4572E; --koraal-licht: #FBE9E4; --amber: #C98A0B; --groen: #3D8B5A; --grijs: #6B7A80;
    --lijn: #C9D6D4; --achtergrond: #F6F9F8; --wit: #fff;
    --kop: Cambria, Georgia, "Times New Roman", serif;
    --romp: Calibri, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--romp); color: var(--tekst); background: var(--achtergrond); font-size: 17px; line-height: 1.4; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 18px 40px; }
  h1, h2, h3 { font-family: var(--kop); color: var(--ink); margin: 0 0 .4em; }
  h1 { font-size: 1.7rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; }
  .knop { background: var(--teal); color: #fff; padding: .65em 1.2em; font-weight: 700; }
  .knop:hover { filter: brightness(1.08); }
  .knop.tweede { background: var(--wit); color: var(--ink); border: 2px solid var(--lijn); }
  .knop.koraal { background: var(--koraal); }
  .knop:disabled { opacity: .45; cursor: default; filter: none; }
  .klein { font-size: .85rem; color: var(--grijs); }
  .rij { display: flex; gap: .6em; flex-wrap: wrap; align-items: center; }
  .kaart { background: var(--wit); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(20,64,74,.08); }
  /* kop */
  .kopbalk { display: flex; justify-content: space-between; align-items: center; gap: 1em; flex-wrap: wrap; margin-bottom: 12px; }
  .label { display: inline-block; padding: .15em .6em; border-radius: 99px; font-size: .8rem; font-weight: 700; background: var(--ink); color: #fff; }
  .label.licht { background: var(--teal-licht); color: var(--ink); }
  .voortgang { min-width: 220px; flex: 1; max-width: 360px; }
  .balk { height: 10px; background: var(--teal-mid); border-radius: 99px; overflow: hidden; }
  .balk > div { height: 100%; background: var(--teal); transition: width .4s; }
  /* startscherm */
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 12px 0 18px; }
  .tegel { background: var(--wit); border-radius: 12px; padding: 10px 12px; border: 2px solid transparent; }
  .tegel.beheerst { border-color: var(--teal); background: var(--teal-licht); }
  .tegel .titel { font-weight: 700; font-size: .95rem; color: var(--ink); }
  .stippen { margin-top: 6px; display: flex; gap: 4px; align-items: center; }
  .stip { width: 12px; height: 12px; border-radius: 50%; background: var(--lijn); }
  .stip.aan { background: var(--teal); }
  .uitleg li { margin: .25em 0; }
  .niveaukeuze { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .niveaukeuze button { flex: 1; min-width: 180px; padding: 1em; font-size: 1.1rem; }
  /* puzzel */
  .context { background: var(--teal-licht); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .stapinfo { font-size: .9rem; color: var(--ink); font-weight: 700; }
  .speelveld { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 820px) { .speelveld { grid-template-columns: 1.15fr 1fr; } }
  .vast { background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 12px; font-weight: 700; }
  .vast small { display: block; font-weight: 400; opacity: .8; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .pijl { text-align: center; color: var(--grijs); line-height: 1; margin: 3px 0; }
  .keten { display: flex; flex-direction: column; }
  .slot { border: 2px dashed var(--lijn); border-radius: 10px; padding: 12px; color: var(--grijs); text-align: center; font-size: .9rem; }
  .schakel { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; background: var(--wit); border: 2px solid var(--lijn); border-radius: 10px; padding: 8px 8px 8px 10px; }
  .schakel.goed { border-color: var(--groen); background: #EAF5EE; }
  .schakel.fout { border-color: var(--koraal); background: var(--koraal-licht); }
  .nr { width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #fff; font-weight: 700; font-size: .85rem; display: grid; place-items: center; }
  .bedien { display: flex; gap: 3px; }
  .bedien button { width: 32px; height: 32px; background: var(--achtergrond); color: var(--ink); border: 1px solid var(--lijn); border-radius: 8px; font-size: 1rem; line-height: 1; }
  .bedien button:disabled { opacity: .3; }
  select.niv { margin-top: 6px; font: inherit; font-size: .9rem; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--lijn); }
  select.niv.fout { border-color: var(--koraal); background: var(--koraal-licht); }
  select.niv.goed { border-color: var(--groen); background: #EAF5EE; }
  .pool { display: flex; flex-direction: column; gap: 8px; }
  .pool button { text-align: left; background: var(--wit); border: 2px solid var(--lijn); padding: 10px 12px; color: var(--tekst); }
  .pool button:hover { border-color: var(--teal); }
  .pool .leeg { color: var(--grijs); font-size: .9rem; }
  .melding { border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
  .melding.info { background: var(--teal-licht); }
  .melding.let { background: var(--koraal-licht); }
  .melding.top { background: #EAF5EE; border: 2px solid var(--groen); }
  .waarom { margin-top: 8px; }
  .waarom details { background: var(--wit); border-radius: 8px; padding: 8px 10px; margin-top: 6px; border: 1px solid var(--lijn); }
  .waarom summary { cursor: pointer; font-weight: 700; color: var(--ink); }
  .uitwerking ol { padding-left: 1.3em; } .uitwerking li { margin: .35em 0; }
  .code { font-family: Consolas, "Courier New", monospace; background: var(--wit); border: 2px dashed var(--teal); padding: 8px 12px; border-radius: 8px; display: inline-block; user-select: all; }
  .tabel { width: 100%; border-collapse: collapse; margin: 8px 0; }
  .tabel td { padding: 6px 8px; border-bottom: 1px solid var(--lijn); }
  .omhoog { color: var(--groen); font-weight: 700; }
  .verborgen { display: none !important; }
  .klein-knop { padding: .3em .8em; font-size: .9rem; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .menukaart p { margin: .5em 0 .8em; }
  /* systeemdiagram */
  .sysdiag { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .ext { align-self: center; text-align: center; width: min(320px, 100%); }
  .ext-label { font-weight: 700; color: var(--koraal); font-size: .85rem; }
  .ext-pijl { color: var(--koraal); font-size: 1.6rem; line-height: 1; }
  .ext select { border: 2px dashed var(--koraal); }
  .sysmid { display: grid; grid-template-columns: 1.25fr 2fr 1.25fr; gap: 12px; align-items: center; }
  @media (max-width: 760px) { .sysmid { grid-template-columns: 1fr; } }
  .grens { border: 4px solid var(--ink); border-radius: 24px; padding: 12px 14px; background: #F3F6F6; }
  .grens-kop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink); }
  .deelgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 4px; }
  .io { display: flex; flex-direction: column; gap: 6px; }
  .io-label { font-weight: 700; color: var(--groen); font-size: .9rem; }
  .io.output .io-label { text-align: right; }
  .vakkeuze { width: 100%; font: inherit; font-size: .9rem; padding: 7px 8px; border-radius: 8px; border: 2px solid var(--lijn); background: #fff; color: var(--tekst); }
  .grens .vakkeuze { border-color: #8FA3A8; }
  .io .vakkeuze { border-color: var(--groen); }
  .vakkeuze.goed { border-color: var(--groen) !important; background: #EAF5EE; }
  .vakkeuze.fout { border-color: var(--koraal) !important; background: var(--koraal-licht); }
  .vakkeuze:disabled { opacity: 1; color: var(--tekst); }
  .vraagkaart { margin-top: 12px; border: 2px solid var(--teal-mid); }
  .opties { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .optie { width: 100%; text-align: left; background: #fff; border: 2px solid var(--lijn); padding: 10px 12px; color: var(--tekst); }
  .optie:hover:not(:disabled) { border-color: var(--teal); }
  .optie.goed { border-color: var(--groen); background: #EAF5EE; }
  .optie.fout { border-color: var(--koraal); background: var(--koraal-licht); }
  .optie:disabled { cursor: default; color: var(--tekst); }
  .optie-uitleg { font-size: .92rem; padding: 4px 12px 2px; color: #8A2E14; }
  .optie-uitleg.goed { color: #1F5E36; }
  .grafiekvak { overflow-x: auto; background: #fff; border: 1px solid var(--lijn); border-radius: 12px; padding: 6px; margin-top: 6px; }
  .legenda { display: flex; gap: 18px; flex-wrap: wrap; font-size: .9rem; padding: 4px 10px 6px; }
  .legstip { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .grafiek { width: 100%; min-width: 520px; height: auto; display: block; font-family: var(--romp); }
  .getalinvoer { font: inherit; font-size: 1.1rem; padding: 8px 10px; width: 180px; border-radius: 8px; border: 2px solid var(--lijn); }
  .getalinvoer:focus { outline: none; border-color: var(--teal); }
</style>
</head>

            ? ["Alle metingen van de nieuwe thermometer wijken in dezelfde richting en evenveel af.", `Ze liggen steeds ongeveer ${Math.abs(verschuiving)} °C ${verschuiving > 0 ? "te hoog" : "te laag"}.`, "Een afwijking die steeds even groot en in dezelfde richting is, is een systematische fout. Herhalen helpt niet; ijken wel."]
            : ["De metingen wijken soms naar boven en soms naar beneden af.", "Er is geen vaste richting of grootte.", "Dat is een toevallige fout. Herhalen en middelen maakt de uitkomst betrouwbaarder."] };
      },
    },
    {
      id: "g-verband", niveaus: ["havo", "vwo"], titel: "Wat voor verband?", denkwijze: "E39",
      maak(r) {
        const lin = r.kies([true, false]);
        if (lin) {
          const v = r.kies([0.3, 0.35, 0.4]);
          return { context: "Iemand meet een maand lang hoe lang een haar is gegroeid sinds het knippen.",
            grafiek: { x: { min: 0, max: 30, stap: 5, label: "tijd (dagen)" }, y: { min: 0, max: 14, stap: 2, label: "groei (mm)" }, series: [{ punten: reeks(0, 30, 3, (t) => v * t), punten_tonen: true }] },
            vraag: "Welk verband is er tussen de tijd en de groei?", soort: "mc", opties: ["lineair", "exponentieel", "sigmoïde", "omgekeerd evenredig"], goed: 0,
            uitleg: ["Let eerst op de assen: beide zijn gewone (lineaire) assen.", `De lijn is recht: elke dag komt er evenveel bij (ongeveer ${String(v).replace(".", ",")} mm).`, "Een rechte lijn op lineaire assen is een lineair verband."] };
        }
        const td = r.kies([20, 30]);
        return { context: "In een experiment wordt het aantal virusdeeltjes in een celkweek gemeten. Let op de verticale as.",
          grafiek: { x: { min: 0, max: 12, stap: 2, label: "tijd (uur)" }, y: { log: true, min: 100, max: 1e9, label: "aantal virusdeeltjes" }, series: [{ punten: reeks(0, 12, 1, (t) => 1000 * Math.pow(2, (t * 60) / (td * 3))), punten_tonen: true }] },
          vraag: "Welk verband is er tussen de tijd en het aantal virusdeeltjes?", soort: "mc", opties: ["lineair", "exponentieel", "sigmoïde", "omgekeerd evenredig"], goed: 1,
          uitleg: ["Let eerst op de assen: de verticale as is logaritmisch (elke streep ×10).", "De punten liggen op een rechte lijn.", "Een rechte lijn op een logaritmische as betekent: in gelijke tijd steeds hetzelfde aantal keer zo veel. Dat is een exponentieel verband."] };
      },
    },
    {
      id: "g-sigmoide", niveaus: ["havo", "vwo"], titel: "Sigmoïde groei: welke periode?", denkwijze: "C22 · E39",
      maak(r) {
        const f = logistisch(800, 5, 0.5);
        const vraagSoort = r.kies(["absoluut", "absoluut", "remming"]);
        const banden = [{ x1: 0, x2: 6, tekst: "A" }, { x1: 8, x2: 14, tekst: "B" }, { x1: 18, x2: 24, tekst: "C" }];
        const g = { x: { min: 0, max: 24, stap: 4, label: "tijd (uur)" }, y: { min: 0, max: 1000, stap: 200, label: "aantal (× 1 000)" }, series: [{ punten: reeks(0, 24, 0.5, f) }], banden };
        if (vraagSoort === "remming")
          return { context: "Bacteriën groeien 24 uur lang in een klein afgesloten buisje met weinig voedingsstoffen.", grafiek: g,
            vraag: "In welke periode remmen gebrek aan voedingsstoffen en ophoping van afvalstoffen de groei het sterkst?", soort: "mc", opties: ["periode A", "periode B", "periode C"], goed: 2,
            uitleg: ["In periode C is de grafiek bijna vlak: er komen nauwelijks bacteriën bij.", "Er zijn dan veel bacteriën, maar weinig voedingsstoffen en veel afvalstoffen.", "De groei wordt daar het sterkst geremd."] };
        return { context: "Bacteriën groeien 24 uur lang in een klein afgesloten buisje met weinig voedingsstoffen.", grafiek: g,
          vraag: "In welke periode komen er per uur de meeste bacteriën bij?", soort: "mc", opties: ["periode A", "periode B", "periode C"], goed: 1,
          uitleg: ["Waar de grafiek het steilst loopt, komen er per uur de meeste bacteriën bij: in periode B.", "In A verdubbelt het aantal wel snel, maar het gaat om kleine aantallen: weinig bacteriën per uur erbij.", "In C remmen gebrek aan voedsel en afvalstoffen de groei. Let dus op het verschil tussen ‘snel verdubbelen’ en ‘veel erbij per uur’ (C22)."] };
      },
    },
  ];
  function fmt(x) { const m = { 1: "10", 2: "100", 3: "1 000", 4: "10⁴", 5: "10⁵", 6: "10⁶" }; const e = Math.round(Math.log10(x)); return m[e] || "10^" + e; }
})();

<!-- ============ EINDE OEFENSTOF ============ -->

<script>
(() => {
  "use strict";
  const RONDE = 4;                          // ketens per ronde
  const MAXSTAP = { havo: 2, vwo: 3 };      // vwo: stap 3 = organisatieniveaus erbij
  const STAPNAAM = { 1: "Stap 1 · zet de schakels op volgorde", 2: "Stap 2 · haal de foute kaartjes eruit", 3: "Stap 3 · zet bij elke schakel het niveau" };
  const NIVEAUS = ["molecuul", "cel", "weefsel", "orgaan", "organisme", "populatie"];

  // ---------- helpers ----------
  const $app = document.getElementById("app");
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  };
  const schud = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // opslag: alleen op het apparaat van de leerling; valt stil terug op geheugen
  const geheugen = {};
  const opslag = {
    lees(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return geheugen[k] || null; } },
    schrijf(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { geheugen[k] = v; } },
    wis(k) { try { localStorage.removeItem(k); } catch (e) { delete geheugen[k]; } },
  };

  // ---------- instellingen uit de link ----------
  const params = new URLSearchParams(location.search);
  const sets = window.OEFENSETS || [];
  const set = sets.find((s) => s.id === params.get("thema")) || sets[0];
  let niveau = ["havo", "vwo"].includes(params.get("niveau")) ? params.get("niveau") : null;
  const niveauVast = !!niveau;
  const vastOnderdeel = ["keten", "systeem", "grafiek"].includes(params.get("onderdeel")) ? params.get("onderdeel") : null;
  const naarStart = () => (vastOnderdeel === "keten" ? start() : vastOnderdeel === "systeem" ? sysStart() : vastOnderdeel === "grafiek" ? grStart() : menu());
  const menuKnop = () => (vastOnderdeel ? null : h("button", { class: "knop tweede klein-knop", onclick: menu }, "← Menu"));

  let ketens = [], sleutel = "", voortgang = null;
  function laadNiveau(n) {
    niveau = n;
    ketens = set.ketens.filter((k) => k.niveau === niveau);
    sleutel = `ketenpuzzel:v1:${set.id}:${niveau}`;
    voortgang = opslag.lees(sleutel) || { k: {}, rondes: 0, record: 0, totaal: 0 };
    ketens.forEach((k) => { if (!voortgang.k[k.id]) voortgang.k[k.id] = { stap: 1, beheerst: false, gemist: 0, laatst: -1 }; });
    bewaar();
    laadSys();
    laadGraf();
  }
  const bewaar = () => opslag.schrijf(sleutel, voortgang);
  const aantalBeheerst = () => ketens.filter((k) => voortgang.k[k.id].beheerst).length;

  // ---------- kop ----------
  function kop() { return kopAlg("Ketenpuzzel", "C21 oorzaak-gevolg", aantalBeheerst(), ketens.length, "ketens"); }
  function kopAlg(titel, label, b, n, eenheid) {
    return h("div", { class: "kopbalk" },
      h("div", {},
        h("h1", {}, titel),
        h("div", { class: "rij" }, h("span", { class: "label" }, niveau.toUpperCase()), h("span", { class: "label licht" }, label), h("span", { class: "klein" }, set.titel))),
      h("div", { class: "voortgang" },
        h("div", { class: "klein" }, `Beheerst: ${b} van ${n} ${eenheid}`),
        h("div", { class: "balk" }, h("div", { style: `width:${n ? (100 * b) / n : 0}%` }))));
  }

  // ---------- niveaukeuze ----------
  function niveauScherm() {
    $app.replaceChildren(
      h("h1", {}, "Oefenen met denk- en werkwijzen"),
      h("p", {}, "Oefen met oorzaak-gevolgketens, systeemdiagrammen en grafieken over afweer, virussen en bacteriën en thermoregulatie. Kies je niveau."),
      h("div", { class: "niveaukeuze" },
        h("button", { class: "knop", onclick: () => { laadNiveau("havo"); naarStart(); } }, "havo"),
        h("button", { class: "knop", onclick: () => { laadNiveau("vwo"); naarStart(); } }, "vwo")));
  }

  // ---------- startscherm ----------
  function start() {
    const max = MAXSTAP[niveau], b = aantalBeheerst();
    const tegels = ketens.map((k) => {
      const v = voortgang.k[k.id];
      const stippen = [];
      for (let s = 1; s <= max; s++) stippen.push(h("span", { class: "stip" + (v.beheerst || s < v.stap ? " aan" : "") }));
      return h("div", { class: "tegel" + (v.beheerst ? " beheerst" : "") },
        h("div", { class: "titel" }, k.titel),
        h("div", { class: "stippen" }, stippen, h("span", { class: "klein", style: "margin-left:6px" }, v.beheerst ? "beheerst" : `stap ${v.stap}`)));
    });
    const tekst = b === ketens.length
      ? "Je beheerst alle ketens. Een herhalingsronde houdt het vers."
      : voortgang.rondes === 0 ? "Een ronde = 4 ketens, ongeveer 5 minuten." : `Nog ${ketens.length - b} ketens te gaan. Een ronde = 4 ketens, ongeveer 5 minuten.`;
    $app.replaceChildren(
      kop(),
      h("div", { class: "kaart" },
        vastOnderdeel ? "" : h("div", { class: "rij", style: "margin-bottom:8px" }, menuKnop()),
        h("h2", {}, "Zo werkt het"),
        h("ul", { class: "uitleg" },
          h("li", {}, "Je krijgt een begin en een eind. Bouw de keten ertussen: tik op een kaartje om het toe te voegen, en gebruik ↑ ↓ ✕ om te schuiven of terug te leggen."),
          h("li", {}, `Elke keten heeft ${max} stappen: ${niveau === "vwo" ? "volgorde, foute kaartjes eruit, en organisatieniveaus erbij" : "volgorde, en daarna foute kaartjes eruit"}. Een keten is beheerst als je de laatste stap in één keer goed hebt, zonder hint.${niveau === "vwo" ? " Heb je een stap in één keer goed, dan sla je de tussenstap over." : ""}`),
          h("li", {}, "Ketens die je nog niet beheerst, komen vaker terug. Elke ronde krijg je andere foute kaartjes.")),
        h("div", { class: "raster" }, tegels),
        h("div", { class: "rij" },
          h("button", { class: "knop", onclick: nieuweRonde }, voortgang.rondes ? "Start een nieuwe ronde" : "Start de eerste ronde"),
          h("span", { class: "klein" }, tekst),
          voortgang.record ? h("span", { class: "klein" }, `Je record: ${voortgang.record} van ${RONDE * 3} punten in één ronde.`) : null),
        h("div", { class: "rij", style: "margin-top:14px" },
          h("button", { class: "knop tweede", onclick: () => { if (confirmWis()) { opslag.wis(sleutel); laadNiveau(niveau); start(); } } }, "Voortgang wissen"))));
  }
  // bevestiging zonder browserdialoog (blokkeert in een iframe niet)
  let wisKlik = 0;
  function confirmWis() { wisKlik++; if (wisKlik >= 2) { wisKlik = 0; return true; } setTimeout(() => (wisKlik = 0), 3000); toon("Klik nog een keer binnen 3 seconden om je voortgang te wissen."); return false; }
  function toon(t) { const m = h("div", { class: "melding let" }, t); $app.append(m); setTimeout(() => m.remove(), 3000); }

  // ---------- ronde ----------
  let ronde = null;
  function nieuweRonde() {
    voortgang.rondes++;
    const nr = voortgang.rondes;
    const open = ketens.filter((k) => !voortgang.k[k.id].beheerst);
    const klaar = ketens.filter((k) => voortgang.k[k.id].beheerst);
    // prioriteit: vaak gemist en lang niet gezien eerst, met wat toeval
    const score = (k) => { const v = voortgang.k[k.id]; return v.gemist * 2 + (nr - 1 - v.laatst) * 0.5 + Math.random() * 2; };
    let keuze = open.sort((a, b) => score(b) - score(a)).slice(0, RONDE);
    if (keuze.length < RONDE) keuze = keuze.concat(schud(klaar).slice(0, RONDE - keuze.length));
    ronde = { nr, lijst: schud(keuze), i: 0, punten: 0, uitslag: [], reeks: 0 };
    bewaar();
    puzzel();
  }

  // ---------- puzzel ----------
  let p = null;
  function puzzel() {
    const k = ronde.lijst[ronde.i];
    const v = voortgang.k[k.id];
    const stap = v.beheerst ? MAXSTAP[niveau] : v.stap;
    const afl = stap === 1 ? schud(k.afleiders).slice(0, 1) : k.afleiders.slice();
    const kaartjes = schud([
      ...k.schakels.map((s, i) => ({ id: "s" + i, t: s.t, soort: "s", i, niv: s.niv || [] })),
      ...afl.map((a, i) => ({ id: "a" + i, t: a.t, soort: "a", waarom: a.waarom })),
    ]);
    p = { k, v, stap, kaartjes, keten: [], niv: {}, pogingen: 0, hints: 0, uitwerking: false, opgelost: false, markeer: false, melding: null, uitStap: 0 };
    teken();
  }
  const kaartje = (id) => p.kaartjes.find((c) => c.id === id);

  function teken() {
    const { k, stap } = p;
    const n = k.schakels.length;
    const metNiv = niveau === "vwo" && stap === 3;

    // keten
    const ketenEl = h("div", { class: "keten" },
      h("div", { class: "vast" }, h("small", {}, "begin"), k.begin),
      h("div", { class: "pijl" }, "↓"));
    p.keten.forEach((id, pos) => {
      const c = kaartje(id);
      let klasse = "schakel";
      if (p.markeer) klasse += c.soort === "s" && c.i === pos ? " goed" : " fout";
      const bedien = p.opgelost || p.uitwerking ? null : h("div", { class: "bedien" },
        h("button", { title: "omhoog", "aria-label": "omhoog", disabled: pos === 0, onclick: () => { schuif(pos, -1); } }, "↑"),
        h("button", { title: "omlaag", "aria-label": "omlaag", disabled: pos === p.keten.length - 1, onclick: () => { schuif(pos, 1); } }, "↓"),
        h("button", { title: "terugleggen", "aria-label": "terugleggen", onclick: () => { p.keten.splice(pos, 1); delete p.niv[id]; p.markeer = false; p.melding = null; teken(); } }, "✕"));
      let nivEl = null;
      if (metNiv) {
        const sel = h("select", { class: "niv", "aria-label": "organisatieniveau", disabled: p.opgelost || p.uitwerking, onchange: (e) => { p.niv[id] = e.target.value; p.markeer = false; } },
          h("option", { value: "" }, "niveau…"), NIVEAUS.map((x) => h("option", { value: x, selected: p.niv[id] === x }, x)));
        if (p.markeer && p.niv[id] && c.soort === "s") sel.classList.add(c.niv.includes(p.niv[id]) ? "goed" : "fout");
        nivEl = sel;
      }
      ketenEl.append(h("div", { class: klasse }, h("div", { class: "nr" }, pos + 1), h("div", {}, c.t, nivEl ? h("div", {}, nivEl) : null), bedien));
      ketenEl.append(h("div", { class: "pijl" }, "↓"));
    });
    if (!p.opgelost && !p.uitwerking) ketenEl.append(h("div", { class: "slot" }, p.keten.length ? "tik op een kaartje om de keten aan te vullen" : "tik op het kaartje dat als eerste komt"), h("div", { class: "pijl" }, "↓"));
    ketenEl.append(h("div", { class: "vast" }, h("small", {}, "eind"), k.eind));

    // pool
    const over = p.kaartjes.filter((c) => !p.keten.includes(c.id));
    const pool = h("div", { class: "pool" },
      h("h3", {}, "Kaartjes"),
      stap >= 2 ? h("div", { class: "klein" }, "Let op: niet elk kaartje hoort in de keten.") : h("div", { class: "klein" }, `Deze keten heeft ${k.schakels.length} schakels. Eén kaartje hoort er niet bij.`),
      over.length ? over.map((c) => h("button", { disabled: p.opgelost || p.uitwerking, onclick: () => { p.keten.push(c.id); p.markeer = false; p.melding = null; teken(); } }, c.t)) : h("div", { class: "leeg" }, "Alle kaartjes liggen in de keten."));

    // knoppen
    const knoppen = h("div", { class: "rij", style: "margin-top:12px" });
    if (!p.opgelost && !p.uitwerking) {
      knoppen.append(h("button", { class: "knop", onclick: controleer, disabled: p.keten.length === 0 }, "Controleer"));
      const hintTekst = p.hints === 0 ? "Hint (−1 punt)" : p.hints === 1 ? "Laat zien wat goed staat" : "Toon de uitwerking";
      knoppen.append(h("button", { class: "knop tweede", onclick: hint, disabled: p.pogingen === 0, title: p.pogingen === 0 ? "Probeer eerst zelf" : "" }, hintTekst));
      if (p.pogingen === 0) knoppen.append(h("span", { class: "klein" }, "Hints komen vrij na je eerste controle."));
    }

    // meldingen
    const meld = [];
    if (p.melding) meld.push(h("div", { class: "melding " + p.melding.soort }, p.melding.tekst));
    if (p.hints >= 1 && !p.opgelost) meld.push(h("div", { class: "melding info" }, h("b", {}, "Hint: "), k.hint));
    if (p.uitwerking) meld.push(uitwerkingEl());
    if (p.opgelost) meld.push(afloopEl());

    $app.replaceChildren(
      kop(),
      h("div", { class: "kaart" },
        h("div", { class: "rij", style: "justify-content:space-between" },
          h("div", { class: "rij" }, h("button", { class: "knop tweede klein-knop", onclick: start, title: "Ketens die je al af hebt, blijven meetellen" }, "← Overzicht"),
            h("span", { class: "stapinfo" }, `Keten ${ronde.i + 1} van ${ronde.lijst.length} · ${STAPNAAM[stap]}`)),
          h("div", { class: "klein" }, `Punten deze ronde: ${ronde.punten}`)),
        h("h2", { style: "margin-top:6px" }, k.titel),
        h("div", { class: "context" }, k.context),
        h("div", { class: "speelveld" }, h("div", {}, ketenEl), pool),
        knoppen, meld));
  }

  function schuif(pos, d) { const a = p.keten; [a[pos], a[pos + d]] = [a[pos + d], a[pos]]; p.markeer = false; p.melding = null; teken(); }

  function controleer() {
    const { k, stap } = p;
    const n = k.schakels.length;
    const inKeten = p.keten.map(kaartje);
    const afl = inKeten.filter((c) => c.soort === "a").length;
    const goedeErin = inKeten.filter((c) => c.soort === "s").length;
    const opPlek = inKeten.filter((c, pos) => c.soort === "s" && c.i === pos).length;
    const volgordeGoed = afl === 0 && goedeErin === n && opPlek === n;
    const metNiv = niveau === "vwo" && stap === 3;
    const nivFout = metNiv ? inKeten.filter((c) => c.soort === "s" && !c.niv.includes(p.niv[c.id])).length : 0;
    // onvolledige keten telt niet als poging: eerst afmaken
    if (p.keten.length < n) {
      p.melding = { soort: "info", tekst: "Je keten is nog niet compleet. Maak hem eerst af; een onvolledige keten telt niet als poging." };
      return teken();
    }
    if (metNiv && inKeten.some((c) => !p.niv[c.id])) {
      p.melding = { soort: "info", tekst: "Kies eerst bij elke schakel een organisatieniveau." };
      return teken();
    }
    p.pogingen++;
    if (volgordeGoed && nivFout === 0) return opgelost();
    const delen = [];
    if (afl) delen.push(afl === 1 ? "Er staat een kaartje in je keten dat er niet in hoort." : `Er staan ${afl} kaartjes in je keten die er niet in horen.`);
    if (goedeErin < n) delen.push(n - goedeErin === 1 ? "Er ontbreekt nog een schakel." : `Er ontbreken nog ${n - goedeErin} schakels.`);
    if (!afl && goedeErin === n && opPlek < n) delen.push(`Alle goede schakels staan erin, maar ${n - opPlek} ${n - opPlek === 1 ? "staat" : "staan"} nog niet op de goede plek.`);
    if (volgordeGoed && nivFout) delen.push(`De volgorde klopt! Nog ${nivFout} ${nivFout === 1 ? "niveau klopt" : "niveaus kloppen"} niet.`);
    p.melding = { soort: "let", tekst: delen.join(" ") + (p.pogingen === 1 ? " Probeer het nog eens, of vraag een hint." : "") };
    if (p.hints >= 2) p.markeer = true;
    teken();
  }

  function hint() {
    if (p.hints === 0) { p.hints = 1; }
    else if (p.hints === 1) { p.hints = 2; p.markeer = true; p.melding = { soort: "info", tekst: "Groen staat goed, rood nog niet. Bij vwo-niveaus: groen of rood rond het keuzemenu." }; }
    else { p.uitwerking = true; p.uitStap = 0; }
    teken();
  }

  function punten() { if (p.uitwerking) return 0; if (p.hints > 0) return 1; return p.pogingen === 1 ? 3 : 2; }

  function opgelost() {
    p.opgelost = true; p.markeer = true;
    const pt = punten();
    const v = p.v, max = MAXSTAP[niveau];
    let verandering = "";
    if (!v.beheerst) {
      if (p.stap === max && pt === 3) { v.beheerst = true; verandering = "beheerst"; }
      // doorschieten: in één keer goed zonder hint → meteen naar de laatste stap
      else if (p.stap < max && pt >= 2) { v.stap = pt === 3 ? max : v.stap + 1; verandering = "stap " + v.stap; }
      if (pt < 3) v.gemist++; else v.gemist = Math.max(0, v.gemist - 1);
    }
    v.laatst = ronde.nr;
    ronde.punten += pt; voortgang.totaal += pt;
    ronde.reeks = pt === 3 ? ronde.reeks + 1 : 0;
    ronde.uitslag.push({ titel: p.k.titel, pt, verandering });
    p.pt = pt; p.verandering = verandering;
    bewaar(); teken();
  }

  function waaromEl() {
    const afl = p.kaartjes.filter((c) => c.soort === "a");
    if (!afl.length) return null;
    return h("div", { class: "waarom" },
      h("b", {}, afl.length === 1 ? "Waarom hoorde dit kaartje er niet in?" : "Waarom hoorden deze kaartjes er niet in?"),
      afl.map((c) => h("details", {}, h("summary", {}, c.t), h("div", { style: "margin-top:6px" }, c.waarom))));
  }

  function afloopEl() {
    const laatste = ronde.i === ronde.lijst.length - 1;
    const lof = p.pt === 3 ? (ronde.reeks >= 2 ? `In één keer goed. Dat is ${ronde.reeks} op rij!` : "In één keer goed!") : p.pt === 2 ? "Goed, na een extra poging." : "Goed, met hulp van een hint.";
    const extra = p.verandering === "beheerst" ? " Deze keten is nu beheerst." : p.verandering ? ` Volgende keer: ${p.verandering}.` : (p.v.beheerst ? "" : " Deze keten komt terug.");
    return h("div", { class: "melding top" },
      h("div", {}, h("b", {}, `+${p.pt} ${p.pt === 1 ? "punt" : "punten"}. `), lof, extra),
      waaromEl(),
      h("div", { class: "rij", style: "margin-top:10px" },
        h("button", { class: "knop", onclick: volgende }, laatste ? "Bekijk je ronde" : "Volgende keten")));
  }

  function uitwerkingEl() {
    const { k } = p;
    const n = k.schakels.length;
    const metNiv = niveau === "vwo" && p.stap === 3;
    const items = k.schakels.slice(0, p.uitStap).map((s) => h("li", {}, s.t, metNiv ? h("span", { class: "klein" }, `  · ${s.niv.join(" of ")}`) : null));
    const klaar = p.uitStap >= n;
    return h("div", { class: "melding info uitwerking" },
      h("b", {}, "Uitwerking"), h("span", { class: "klein" }, " · 0 punten voor deze keten, hij komt later terug."),
      h("ol", {}, items),
      !klaar ? h("button", { class: "knop tweede", onclick: () => { p.uitStap++; teken(); } }, p.uitStap === 0 ? "Toon de eerste schakel" : "Volgende schakel") : null,
      klaar ? waaromEl() : null,
      klaar ? h("div", { class: "rij", style: "margin-top:10px" }, h("button", { class: "knop", onclick: naUitwerking }, ronde.i === ronde.lijst.length - 1 ? "Bekijk je ronde" : "Volgende keten")) : null);
  }

  function naUitwerking() {
    const v = p.v;
    if (!v.beheerst) v.gemist++;
    v.laatst = ronde.nr;
    ronde.reeks = 0;
    ronde.uitslag.push({ titel: p.k.titel, pt: 0, verandering: "" });
    bewaar(); volgende();
  }

  function volgende() {
    if (ronde.i < ronde.lijst.length - 1) { ronde.i++; puzzel(); }
    else eindeRonde();
  }

  // ---------- einde ronde ----------
  function eindeRonde() {
    const max = ronde.lijst.length * 3;
    const record = ronde.punten > voortgang.record;
    if (record) voortgang.record = ronde.punten;
    bewaar();
    const b = aantalBeheerst(), n = ketens.length;
    const code = `${niveau === "havo" ? "H" : "V"} · ronde ${ronde.nr} · ${ronde.punten}/${max} punten · beheerst ${b}/${n}`;
    const nogTeGaan = n - b;
    const aansporing = nogTeGaan === 0
      ? "Alles beheerst. Knap! Een herhalingsronde later deze week houdt het vast."
      : ronde.punten >= max - 2
        ? `Sterke ronde. Nog ${nogTeGaan} ${nogTeGaan === 1 ? "keten" : "ketens"} te gaan: pak je de volgende ronde ook?`
        : `Nog ${nogTeGaan} ${nogTeGaan === 1 ? "keten" : "ketens"} te gaan. De ketens die nog lastig waren, komen in de volgende ronde terug, met andere foute kaartjes.`;
    $app.replaceChildren(
      kop(),
      h("div", { class: "kaart" },
        h("h2", {}, `Ronde ${ronde.nr} klaar: ${ronde.punten} van ${max} punten`),
        record && ronde.nr > 1 ? h("div", { class: "melding top" }, "Nieuw persoonlijk record!") : null,
        h("table", { class: "tabel" }, ronde.uitslag.map((u) => h("tr", {},
          h("td", {}, u.titel), h("td", {}, `${u.pt} ${u.pt === 1 ? "punt" : "punten"}`),
          h("td", { class: "omhoog" }, u.verandering === "beheerst" ? "✓ beheerst" : u.verandering ? "↑ " + u.verandering : "")))),
        h("p", {}, aansporing),
        h("div", { class: "rij" },
          h("button", { class: "knop", onclick: nieuweRonde }, "Nog een ronde"),
          h("button", { class: "knop tweede", onclick: start }, "Naar het overzicht"),
          vastOnderdeel ? null : h("button", { class: "knop tweede", onclick: menu }, "Menu")),
        h("div", { style: "margin-top:16px" },
          h("div", { class: "klein" }, "Code voor Learnbeat (kopieer en plak bij de vraag onder deze oefening):"),
          h("div", { class: "code" }, code))));
  }

  // =====================================================================
  // MENU
  // =====================================================================
  function menuKaart(titel, label, tekst, b, n, eenheid, actie, gestart) {
    return h("div", { class: "kaart menukaart" },
      h("div", { class: "rij" }, h("h2", { style: "margin:0" }, titel), h("span", { class: "label licht" }, label)),
      h("p", {}, tekst),
      h("div", { class: "klein" }, `Beheerst: ${b} van ${n} ${eenheid}`),
      h("div", { class: "balk", style: "margin:4px 0 12px" }, h("div", { style: `width:${n ? (100 * b) / n : 0}%` })),
      h("button", { class: "knop", onclick: actie }, gestart ? "Verder oefenen" : "Beginnen"));
  }
  function menu() {
    $app.replaceChildren(
      h("div", { class: "kopbalk" }, h("div", {},
        h("h1", {}, "Oefenen met denk- en werkwijzen"),
        h("div", { class: "rij" }, h("span", { class: "label" }, niveau.toUpperCase()), h("span", { class: "klein" }, set.titel)))),
      h("div", { class: "menu" },
        menuKaart("Ketenpuzzel", "C21 oorzaak-gevolg", "Bouw oorzaak-gevolgketens tussen een begin en een eind, en haal de foute schakels eruit.", aantalBeheerst(), ketens.length, "ketens", start, voortgang.rondes > 0),
        diagrammen.length ? menuKaart("Systeemdiagram", "C23 systemen", "Vul systeemdiagrammen in: grens, deelsystemen, input, output en externe factor. Voorspel daarna wat een verstoring doet.", sysBeheerst(), diagrammen.length, "diagrammen", sysStart, sysVg.rondes > 0) : null,
        grafieken.length ? menuKaart("Grafieken en patronen", "C20 · E38 · E39 · C22", "Herken patronen, lees grafieken af (ook op een logaritmische as) en reken verder. Elke keer andere getallen.", grBeheerst(), grafieken.length, "oefeningen", grStart, grVg.rondes > 0) : null),
      !niveauVast ? h("div", { class: "rij", style: "margin-top:14px" }, h("button", { class: "knop tweede", onclick: niveauScherm }, "Ander niveau")) : "");
  }

  // =====================================================================
  // SYSTEEMDIAGRAM (C23)
  // =====================================================================
  const SYS_RONDE = 3, SYS_MAX = 2;
  const SOORT = { deel: "Deelsysteem", input: "Input", output: "Output", extern: "Externe factor" };
  let diagrammen = [], sysSleutel = "", sysVg = null;
  function laadSys() {
    diagrammen = (set.diagrammen || []).filter((d) => d.niveaus.includes(niveau));
    sysSleutel = `systeem:v1:${set.id}:${niveau}`;
    sysVg = opslag.lees(sysSleutel) || { d: {}, rondes: 0, record: 0 };
    diagrammen.forEach((d) => { if (!sysVg.d[d.id]) sysVg.d[d.id] = { stap: 1, beheerst: false, gemist: 0, laatst: -1 }; });
    sysBewaar();
  }
  const sysBewaar = () => opslag.schrijf(sysSleutel, sysVg);
  const sysBeheerst = () => diagrammen.filter((d) => sysVg.d[d.id].beheerst).length;
  const vragenVoor = (d) => d.vragen.filter((v) => v.niveau === "beide" || v.niveau === niveau);
  const sysMaxPunten = (d) => 3 + vragenVoor(d).length;
  function kopSys() { return kopAlg("Systeemdiagram", "C23 systemen", sysBeheerst(), diagrammen.length, "diagrammen"); }

  function sysStart() {
    const b = sysBeheerst();
    const tegels = diagrammen.map((d) => {
      const v = sysVg.d[d.id];
      const stippen = [];
      for (let s = 1; s <= SYS_MAX; s++) stippen.push(h("span", { class: "stip" + (v.beheerst || s < v.stap ? " aan" : "") }));
      return h("div", { class: "tegel" + (v.beheerst ? " beheerst" : "") },
        h("div", { class: "titel" }, d.titel),
        h("div", { class: "klein" }, `niveau: ${d.niv[0]}`),
        h("div", { class: "stippen" }, stippen, h("span", { class: "klein", style: "margin-left:6px" }, v.beheerst ? "beheerst" : `stap ${v.stap}`)));
    });
    $app.replaceChildren(
      kopSys(),
      h("div", { class: "kaart" },
        vastOnderdeel ? "" : h("div", { class: "rij", style: "margin-bottom:8px" }, menuKnop()),
        h("h2", {}, "Zo werkt het"),
        h("ul", { class: "uitleg" },
          h("li", {}, "Je krijgt een situatie en een leeg systeemdiagram. Kies in elk vak het goede onderdeel: het organisatieniveau, de deelsystemen binnen de grens, de input en output die de grens kruisen, en de externe factor die van buiten invloed heeft."),
          h("li", {}, "Klopt het diagram, dan krijg je één of twee vragen: wat doet een verstoring, is het systeem open of gesloten, wat is emergentie?"),
          h("li", {}, "Stap 1 heeft weinig foute opties, stap 2 meer. Een diagram is beheerst als je stap 2 in één keer goed hebt én de vragen in één keer goed beantwoordt.")),
        h("div", { class: "raster" }, tegels),
        h("div", { class: "rij" },
          h("button", { class: "knop", onclick: sysNieuweRonde }, sysVg.rondes ? "Start een nieuwe ronde" : "Start de eerste ronde"),
          h("span", { class: "klein" }, b === diagrammen.length ? "Alles beheerst. Een herhalingsronde houdt het vers." : `Een ronde = ${SYS_RONDE} diagrammen, ongeveer 6 minuten.`),
          sysVg.record ? h("span", { class: "klein" }, `Je record: ${sysVg.record} punten in één ronde.`) : null),
        h("div", { class: "rij", style: "margin-top:14px" },
          h("button", { class: "knop tweede", onclick: () => { if (confirmWis()) { opslag.wis(sysSleutel); laadSys(); sysStart(); } } }, "Voortgang wissen"))));
  }

  let sr = null, q = null;
  function sysNieuweRonde() {
    sysVg.rondes++;
    const nr = sysVg.rondes;
    const open = diagrammen.filter((d) => !sysVg.d[d.id].beheerst), klaar = diagrammen.filter((d) => sysVg.d[d.id].beheerst);
    const score = (d) => { const v = sysVg.d[d.id]; return v.gemist * 2 + (nr - 1 - v.laatst) * 0.5 + Math.random() * 2; };
    let keuze = open.sort((a, b) => score(b) - score(a)).slice(0, SYS_RONDE);
    if (keuze.length < SYS_RONDE) keuze = keuze.concat(schud(klaar).slice(0, SYS_RONDE - keuze.length));
    sr = { nr, lijst: schud(keuze), i: 0, punten: 0, max: 0, uitslag: [] };
    sysBewaar(); sysPuzzel();
  }

  function sysPuzzel() {
    const d = sr.lijst[sr.i], v = sysVg.d[d.id];
    const stap = v.beheerst ? SYS_MAX : v.stap;
    const opts = {};
    for (const s of Object.keys(SOORT)) {
      const afl = stap === 1 ? schud(d.afleiders[s] || []).slice(0, 1) : (d.afleiders[s] || []);
      opts[s] = schud([...d.vakken[s], ...afl]);
    }
    const keuze = { niv: "" };
    for (const s of Object.keys(SOORT)) keuze[s] = d.vakken[s].map(() => "");
    const vragen = vragenVoor(d).map((vr) => ({ ...vr, opties: schud(vr.opties), gekozen: [], goedEerst: null }));
    q = { d, v, stap, opts, keuze, pogingen: 0, hints: 0, markeer: false, uitwerking: false, fase: "diagram", melding: null, diagramPt: 0, vragen, vi: 0 };
    sysTeken();
  }

  // welke vakken kloppen (volgorde binnen een soort maakt niet uit)
  function vakStatus() {
    const st = { niv: q.d.niv.includes(q.keuze.niv) };
    for (const s of Object.keys(SOORT)) {
      const over = q.d.vakken[s].slice();
      st[s] = q.keuze[s].map((x) => { const i = over.indexOf(x); if (i >= 0) { over.splice(i, 1); return true; } return false; });
    }
    return st;
  }

  function sysTeken() {
    const { d, stap } = q;
    const slot = q.fase !== "diagram";
    const st = vakStatus();
    const kleur = (ok) => (q.markeer || slot ? (ok ? " goed" : " fout") : "");
    const sel = (soort, i) => {
      const lijst = soort === "niv" ? NIVEAUS : q.opts[soort];
      const waarde = soort === "niv" ? q.keuze.niv : q.keuze[soort][i];
      const ok = soort === "niv" ? st.niv : st[soort][i];
      return h("select", { class: "vakkeuze" + (waarde ? kleur(ok) : ""), disabled: slot, "aria-label": soort === "niv" ? "organisatieniveau" : SOORT[soort],
        onchange: (e) => { if (soort === "niv") q.keuze.niv = e.target.value; else q.keuze[soort][i] = e.target.value; q.markeer = q.hints >= 2; q.melding = null; sysTeken(); } },
        h("option", { value: "" }, "kies…"), lijst.map((x) => h("option", { value: x, selected: waarde === x }, x)));
    };
    const io = (soort) => h("div", { class: "io " + soort },
      h("div", { class: "io-label" }, soort === "input" ? "Input →" : "→ Output"),
      q.keuze[soort].map((_, i) => h("div", { class: "vak" }, sel(soort, i))));
    const diagram = h("div", { class: "sysdiag" },
      h("div", { class: "ext" }, h("div", { class: "ext-label" }, "Externe factor"), sel("extern", 0), h("div", { class: "ext-pijl" }, "⇣")),
      h("div", { class: "sysmid" },
        io("input"),
        h("div", { class: "grens" },
          h("div", { class: "grens-kop" }, h("b", {}, "Systeem: ", d.systeem), h("span", { class: "rij", style: "gap:6px" }, h("span", { class: "klein" }, "organisatieniveau:"), sel("niv"))),
          h("div", { class: "klein", style: "margin-top:6px" }, "Deelsystemen"),
          h("div", { class: "deelgrid" }, q.keuze.deel.map((_, i) => h("div", { class: "vak" }, sel("deel", i))))),
        io("output")));

    const blok = [];
    if (q.fase === "diagram") {
      const knoppen = h("div", { class: "rij", style: "margin-top:12px" },
        h("button", { class: "knop", onclick: sysControleer }, "Controleer"),
        h("button", { class: "knop tweede", onclick: sysHint, disabled: q.pogingen === 0 }, q.hints === 0 ? "Hint (−1 punt)" : q.hints === 1 ? "Laat zien wat goed staat" : "Toon de uitwerking"),
        q.pogingen === 0 ? h("span", { class: "klein" }, "Hints komen vrij na je eerste controle.") : null);
      blok.push(knoppen);
      if (q.melding) blok.push(h("div", { class: "melding " + q.melding.soort }, q.melding.tekst));
      if (q.hints >= 1) blok.push(h("div", { class: "melding info" }, h("b", {}, "Hint: "), "Deelsystemen liggen binnen de grens. Input en output kruisen de grens. Een externe factor komt van buiten en beïnvloedt het systeem. Kijk ook: wat bestaat er níét op dit organisatieniveau?"));
    } else {
      blok.push(h("div", { class: "melding top" }, q.uitwerking ? "Dit is het ingevulde diagram (0 punten voor het diagram)." : `Diagram klopt: +${q.diagramPt} ${q.diagramPt === 1 ? "punt" : "punten"}.`));
      blok.push(vraagEl());
    }
    $app.replaceChildren(
      kopSys(),
      h("div", { class: "kaart" },
        h("div", { class: "rij", style: "justify-content:space-between" },
          h("div", { class: "rij" }, h("button", { class: "knop tweede klein-knop", onclick: sysStart }, "← Overzicht"),
            h("span", { class: "stapinfo" }, `Diagram ${sr.i + 1} van ${sr.lijst.length} · stap ${stap}${stap === 1 ? " · weinig foute opties" : " · alle foute opties"}`)),
          h("div", { class: "klein" }, `Punten deze ronde: ${sr.punten}`)),
        h("h2", { style: "margin-top:8px" }, d.titel),
        h("div", { class: "context" }, d.context),
        diagram, blok));
  }

  function sysControleer() {
    const leeg = !q.keuze.niv || Object.keys(SOORT).some((s) => q.keuze[s].some((x) => !x));
    if (leeg) { q.melding = { soort: "info", tekst: "Vul eerst alle vakken in. Een onvolledig diagram telt niet als poging." }; return sysTeken(); }
    const st = vakStatus();
    let fout = st.niv ? 0 : 1, totaal = 1;
    for (const s of Object.keys(SOORT)) { totaal += st[s].length; fout += st[s].filter((x) => !x).length; }
    q.pogingen++;
    if (fout === 0) { q.diagramPt = q.hints > 0 ? 1 : q.pogingen === 1 ? 3 : 2; sr.punten += q.diagramPt; q.fase = "vragen"; return sysTeken(); }
    q.melding = { soort: "let", tekst: `${totaal - fout} van de ${totaal} vakken kloppen. ` + (q.pogingen === 1 ? "Probeer het nog eens, of vraag een hint." : "") };
    sysTeken();
  }
  function sysHint() {
    if (q.hints === 0) q.hints = 1;
    else if (q.hints === 1) { q.hints = 2; q.markeer = true; q.melding = { soort: "info", tekst: "Groen klopt, rood nog niet." }; }
    else {
      q.uitwerking = true; q.diagramPt = 0;
      q.keuze.niv = q.d.niv[0];
      for (const s of Object.keys(SOORT)) q.keuze[s] = q.d.vakken[s].slice();
      q.fase = "vragen";
    }
    sysTeken();
  }

  function vraagEl() {
    const vr = q.vragen[q.vi];
    if (!vr) return null;
    const beantwoord = vr.gekozen.some((i) => vr.opties[i].goed);
    const laatste = q.vi === q.vragen.length - 1;
    return h("div", { class: "kaart vraagkaart" },
      h("div", { class: "klein" }, `Vraag ${q.vi + 1} van ${q.vragen.length}`),
      h("h3", {}, vr.vraag),
      h("div", { class: "opties" }, vr.opties.map((o, i) => {
        const gekozen = vr.gekozen.includes(i);
        return h("div", {},
          h("button", { class: "optie" + (gekozen ? (o.goed ? " goed" : " fout") : ""), disabled: beantwoord || gekozen,
            onclick: () => { vr.gekozen.push(i); if (vr.goedEerst === null) vr.goedEerst = !!o.goed; if (o.goed && vr.goedEerst) sr.punten += 1; sysTeken(); } }, o.t),
          gekozen ? h("div", { class: "optie-uitleg" + (o.goed ? " goed" : "") }, (o.goed ? "Goed. " : "Niet goed. ") + o.waarom) : null);
      })),
      beantwoord ? h("div", { class: "rij", style: "margin-top:10px" },
        h("button", { class: "knop", onclick: () => { if (laatste) sysAfronden(); else { q.vi++; sysTeken(); } } }, laatste ? (sr.i === sr.lijst.length - 1 ? "Bekijk je ronde" : "Volgend diagram") : "Volgende vraag")) : null);
  }

  function sysAfronden() {
    const { d, v } = q;
    const vragenGoed = q.vragen.every((vr) => vr.goedEerst);
    const pt = q.diagramPt + q.vragen.filter((vr) => vr.goedEerst).length;
    let verandering = "";
    if (!v.beheerst) {
      if (q.stap === SYS_MAX && q.diagramPt === 3 && vragenGoed) { v.beheerst = true; verandering = "beheerst"; }
      else if (q.stap < SYS_MAX && q.diagramPt >= 2) { v.stap++; verandering = "stap " + v.stap; }
      if (q.diagramPt < 3 || !vragenGoed) v.gemist++; else v.gemist = Math.max(0, v.gemist - 1);
    }
    v.laatst = sr.nr;
    sr.max += sysMaxPunten(d);
    sr.uitslag.push({ titel: d.titel, pt, max: sysMaxPunten(d), verandering });
    sysBewaar();
    if (sr.i < sr.lijst.length - 1) { sr.i++; sysPuzzel(); } else sysEinde();
  }

  function sysEinde() {
    const record = sr.punten > sysVg.record;
    if (record) sysVg.record = sr.punten;
    sysBewaar();
    const b = sysBeheerst(), n = diagrammen.length, rest = n - b;
    const code = `${niveau === "havo" ? "H" : "V"} · systeem · ronde ${sr.nr} · ${sr.punten}/${sr.max} punten · beheerst ${b}/${n}`;
    $app.replaceChildren(
      kopSys(),
      h("div", { class: "kaart" },
        h("h2", {}, `Ronde ${sr.nr} klaar: ${sr.punten} van ${sr.max} punten`),
        record && sr.nr > 1 ? h("div", { class: "melding top" }, "Nieuw persoonlijk record!") : null,
        h("table", { class: "tabel" }, sr.uitslag.map((u) => h("tr", {},
          h("td", {}, u.titel), h("td", {}, `${u.pt} van ${u.max}`),
          h("td", { class: "omhoog" }, u.verandering === "beheerst" ? "✓ beheerst" : u.verandering ? "↑ " + u.verandering : "")))),
        h("p", {}, rest === 0 ? "Alle diagrammen beheerst. Knap! Probeer ook de ketenpuzzel, of doe later een herhalingsronde." : `Nog ${rest} ${rest === 1 ? "diagram" : "diagrammen"} te gaan. Wat nog lastig was, komt terug met andere foute opties.`),
        h("div", { class: "rij" },
          h("button", { class: "knop", onclick: sysNieuweRonde }, "Nog een ronde"),
          h("button", { class: "knop tweede", onclick: sysStart }, "Naar het overzicht"),
          vastOnderdeel ? null : h("button", { class: "knop tweede", onclick: menu }, "Menu")),
        h("div", { style: "margin-top:16px" },
          h("div", { class: "klein" }, "Code voor Learnbeat (kopieer en plak bij de vraag onder deze oefening):"),
          h("div", { class: "code" }, code))));
  }


  // =====================================================================
  // GRAFIEKEN EN PATRONEN (C20 · E38 · E39 · C22)
  // =====================================================================
  const GR_RONDE = 4, GR_NODIG = 2; // beheerst = 2× op rij in één keer goed (steeds met andere getallen)
  let grafieken = [], grSleutel = "", grVg = null;
  function laadGraf() {
    grafieken = (set.grafieken || []).filter((g) => g.niveaus.includes(niveau));
    grSleutel = `grafiek:v1:${set.id}:${niveau}`;
    grVg = opslag.lees(grSleutel) || { g: {}, rondes: 0, record: 0 };
    grafieken.forEach((g) => { if (!grVg.g[g.id]) grVg.g[g.id] = { opRij: 0, beheerst: false, gemist: 0, laatst: -1 }; });
    grBewaar();
  }
  const grBewaar = () => opslag.schrijf(grSleutel, grVg);
  const grBeheerst = () => grafieken.filter((g) => grVg.g[g.id].beheerst).length;
  const kopGraf = () => kopAlg("Grafieken en patronen", "C20 · E38 · E39 · C22", grBeheerst(), grafieken.length, "oefeningen");
  const toeval = { kies: (a) => a[Math.floor(Math.random() * a.length)], int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)), getal: (a, b) => a + Math.random() * (b - a) };

  // ---- getallen lezen en schrijven ----
  const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-" };
  function leesGetal(s) {
    if (!s) return NaN;
    let t = String(s).trim().toLowerCase().replace(/\s+/g, "").replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, (m) => "^" + [...m].map((c) => SUP[c]).join(""));
    t = t.replace(/[a-z%°]+$/g, "");                      // eenheid erachter weglaten
    t = t.replace(/[×x*·]10\^/g, "e").replace(/^10\^/, "1e");
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "");   // 1.000.000 (Nederlands)
    t = t.replace(",", ".");
    const v = Number(t);
    return Number.isFinite(v) ? v : NaN;
  }
  function mooiGetal(v) {
    if (Math.abs(v) >= 1e4 && Math.abs(Math.log10(Math.abs(v)) % 1) < 1e-9) return "10" + String(Math.round(Math.log10(v))).split("").map((c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c]).join("");
    return v.toLocaleString("nl-NL", { maximumFractionDigits: 2 });
  }

  // ---- SVG-grafiek ----
  function grafiekSvg(g) {
    const NS = "http://www.w3.org/2000/svg";
    const W = 640, H = 340, L = 78, R = 18, T = 22, B = 52;
    const el = (n, a = {}, txt) => { const e = document.createElementNS(NS, n); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt != null) e.textContent = txt; return e; };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "grafiek", role: "img", "aria-label": "grafiek" });
    const alle = g.series.flatMap((s) => s.punten);
    const y = Object.assign({}, g.y);
    if (!y.log && y.max == null) {           // automatische schaal
      const mx = Math.max(...alle.map((p) => p[1]));
      const ruw = mx / 5, m = Math.pow(10, Math.floor(Math.log10(ruw))), f = ruw / m;
      y.stap = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * m;
      y.max = Math.ceil(mx / y.stap) * y.stap;
    }
    const X = (v) => L + ((v - g.x.min) / (g.x.max - g.x.min)) * (W - L - R);
    const Y = y.log ? (v) => H - B - ((Math.log10(Math.max(v, y.min)) - Math.log10(y.min)) / (Math.log10(y.max) - Math.log10(y.min))) * (H - B - T)
                    : (v) => H - B - ((v - y.min) / (y.max - y.min)) * (H - B - T);
    // banden
    (g.banden || []).forEach((b) => {
      svg.append(el("rect", { x: X(b.x1), y: T, width: X(b.x2) - X(b.x1), height: H - B - T, fill: "#FBE9E4", opacity: 0.7 }));
      svg.append(el("text", { x: (X(b.x1) + X(b.x2)) / 2, y: T + 16, "text-anchor": "middle", "font-size": 15, "font-weight": 700, fill: "#B5401F" }, b.tekst));
    });
    // rasterlijnen
    if (g.x.fijn) for (let v = g.x.min; v <= g.x.max + 1e-9; v += g.x.fijn) svg.append(el("line", { x1: X(v), x2: X(v), y1: T, y2: H - B, stroke: "#EEF2F1" }));
    if (y.fijnStap) for (let v = y.min; v <= y.max + 1e-9; v += y.fijnStap) svg.append(el("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "#EEF2F1" }));
    for (let v = g.x.min; v <= g.x.max + 1e-9; v += g.x.stap) {
      svg.append(el("line", { x1: X(v), x2: X(v), y1: T, y2: H - B, stroke: "#DDE5E3" }));
      svg.append(el("text", { x: X(v), y: H - B + 18, "text-anchor": "middle", "font-size": 12, fill: "#5A6A70" }, v.toLocaleString("nl-NL")));
    }
    if (y.log) {
      for (let e = Math.round(Math.log10(y.min)); e <= Math.round(Math.log10(y.max)); e++) {
        const v = Math.pow(10, e);
        svg.append(el("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "#C9D6D4" }));
        for (let k = 2; k <= 9 && e < Math.round(Math.log10(y.max)); k++) svg.append(el("line", { x1: L, x2: W - R, y1: Y(k * v), y2: Y(k * v), stroke: "#F0F4F3" }));
        svg.append(el("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 12, fill: "#5A6A70" }, e >= 4 ? mooiGetal(v) : v.toLocaleString("nl-NL")));
      }
    } else {
      for (let v = y.min; v <= y.max + 1e-9; v += y.stap) {
        svg.append(el("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "#DDE5E3" }));
        svg.append(el("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 12, fill: "#5A6A70" }, (Math.round(v * 100) / 100).toLocaleString("nl-NL")));
      }
    }
    // assen
    svg.append(el("line", { x1: L, x2: L, y1: T, y2: H - B, stroke: "#1E2A32", "stroke-width": 1.5 }));
    svg.append(el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "#1E2A32", "stroke-width": 1.5 }));
    svg.append(el("text", { x: (L + W - R) / 2, y: H - 10, "text-anchor": "middle", "font-size": 13, fill: "#1E2A32" }, g.x.label));
    svg.append(el("text", { x: 16, y: (T + H - B) / 2, "text-anchor": "middle", "font-size": 13, fill: "#1E2A32", transform: `rotate(-90 16 ${(T + H - B) / 2})` }, y.label + (y.log ? " (log)" : "")));
    // pijlen bij tijdstippen
    (g.pijlen || []).forEach((p) => {
      svg.append(el("line", { x1: X(p.x), x2: X(p.x), y1: T, y2: H - B, stroke: "#E4572E", "stroke-dasharray": "4 4" }));
      svg.append(el("text", { x: X(p.x) + 4, y: T + 12, "font-size": 11, fill: "#B5401F" }, p.tekst));
    });
    // reeksen
    const kleuren = { teal: "#0F7C74", koraal: "#E4572E" };
    g.series.forEach((s) => {
      const k = kleuren[s.kleur || "teal"];
      if (!s.alleenPunten) svg.append(el("polyline", { points: s.punten.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" "), fill: "none", stroke: k, "stroke-width": 2.5 }));
      if (s.alleenPunten || s.punten_tonen) s.punten.forEach((p) => svg.append(el("circle", { cx: X(p[0]), cy: Y(p[1]), r: 4, fill: k })));
    });
    return svg;
  }

  // ---- schermen ----
  function grStart() {
    const tegels = grafieken.map((g) => {
      const v = grVg.g[g.id];
      const stippen = [];
      for (let s = 1; s <= GR_NODIG; s++) stippen.push(h("span", { class: "stip" + (v.beheerst || s <= v.opRij ? " aan" : "") }));
      return h("div", { class: "tegel" + (v.beheerst ? " beheerst" : "") },
        h("div", { class: "titel" }, g.titel), h("div", { class: "klein" }, g.denkwijze),
        h("div", { class: "stippen" }, stippen, h("span", { class: "klein", style: "margin-left:6px" }, v.beheerst ? "beheerst" : `${v.opRij} van ${GR_NODIG} op rij`)));
    });
    $app.replaceChildren(
      kopGraf(),
      h("div", { class: "kaart" },
        vastOnderdeel ? "" : h("div", { class: "rij", style: "margin-bottom:8px" }, menuKnop()),
        h("h2", {}, "Zo werkt het"),
        h("ul", { class: "uitleg" },
          h("li", {}, "Je krijgt een grafiek uit de biologie. Herken het patroon, lees af, of reken verder."),
          h("li", {}, "Elke keer zijn de getallen anders: onthouden helpt niet, aflezen wel. Kijk altijd eerst naar de assen!"),
          h("li", {}, `Een oefening is beheerst als je hem ${GR_NODIG} keer achter elkaar in één keer goed hebt.`)),
        h("div", { class: "raster" }, tegels),
        h("div", { class: "rij" },
          h("button", { class: "knop", onclick: grNieuweRonde }, grVg.rondes ? "Start een nieuwe ronde" : "Start de eerste ronde"),
          h("span", { class: "klein" }, `Een ronde = ${GR_RONDE} grafieken, ongeveer 5 minuten.`),
          grVg.record ? h("span", { class: "klein" }, `Je record: ${grVg.record} van ${GR_RONDE * 2} punten.`) : null),
        h("div", { class: "rij", style: "margin-top:14px" },
          h("button", { class: "knop tweede", onclick: () => { if (confirmWis()) { opslag.wis(grSleutel); laadGraf(); grStart(); } } }, "Voortgang wissen"))));
  }

  let gr = null, gv = null;
  function grNieuweRonde() {
    grVg.rondes++;
    const nr = grVg.rondes;
    const open = grafieken.filter((g) => !grVg.g[g.id].beheerst), klaar = grafieken.filter((g) => grVg.g[g.id].beheerst);
    const score = (g) => { const v = grVg.g[g.id]; return v.gemist * 2 + (nr - 1 - v.laatst) * 0.5 + Math.random() * 2; };
    let keuze = open.sort((a, b) => score(b) - score(a)).slice(0, GR_RONDE);
    if (keuze.length < GR_RONDE) keuze = keuze.concat(schud(klaar).slice(0, GR_RONDE - keuze.length));
    gr = { nr, lijst: schud(keuze), i: 0, punten: 0, uitslag: [] };
    grBewaar(); grItem();
  }
  function grItem() {
    const g = gr.lijst[gr.i];
    const opg = g.maak(toeval);
    const volgorde = opg.soort === "mc" ? schud(opg.opties.map((_, i) => i)) : null;
    gv = { g, opg, volgorde, pogingen: 0, gekozen: [], invoer: "", opgelost: false, uitStap: 0, uitleg: false, melding: null };
    grTeken();
  }
  function grControleerGetal() {
    const v = leesGetal(gv.invoer);
    if (Number.isNaN(v)) { gv.melding = { soort: "info", tekst: "Vul een getal in (bijvoorbeeld 25, 1,5 of 10^4)." }; return grTeken(); }
    gv.pogingen++;
    const { antwoord, marge } = gv.opg;
    const ok = Math.abs(v - antwoord) <= (marge || 0) + 1e-9 * Math.abs(antwoord);
    if (ok) return grGoed();
    let tip = "Nog niet goed.";
    if (antwoord !== 0 && Math.abs(v / antwoord - 1) < 0.25) tip = "Bijna! Lees nauwkeuriger af of reken nog eens na.";
    else if (antwoord !== 0 && (Math.abs(v / antwoord - 10) < 1 || Math.abs(v / antwoord - 0.1) < 0.02)) tip = "Je zit er een factor 10 naast. Kijk nog eens naar de as of de machten.";
    gv.melding = { soort: "let", tekst: tip + (gv.pogingen === 1 ? " Probeer het nog een keer." : " Bekijk de uitwerking stap voor stap.") };
    if (gv.pogingen >= 2) gv.uitleg = true;
    grTeken();
  }
  function grKies(i) {
    if (gv.opgelost || gv.gekozen.includes(i)) return;
    gv.gekozen.push(i); gv.pogingen++;
    if (i === gv.opg.goed) return grGoed();
    gv.melding = { soort: "let", tekst: gv.pogingen === 1 ? "Niet goed. Kijk nog eens naar de grafiek (en naar de assen) en kies opnieuw." : "Nog niet goed. Bekijk de uitwerking stap voor stap." };
    if (gv.pogingen >= 2) gv.uitleg = true;
    grTeken();
  }
  function grGoed() {
    gv.opgelost = true; gv.uitleg = true; gv.uitStap = gv.opg.uitleg.length;
    const pt = gv.uitStapGezien ? 0 : gv.pogingen === 1 ? 2 : 1;
    gv.pt = pt; gr.punten += pt;
    const v = grVg.g[gv.g.id];
    if (pt === 2) { v.opRij++; v.gemist = Math.max(0, v.gemist - 1); } else { v.opRij = 0; v.gemist++; }
    gv.verandering = "";
    if (!v.beheerst && v.opRij >= GR_NODIG) { v.beheerst = true; gv.verandering = "beheerst"; }
    v.laatst = gr.nr;
    gr.uitslag.push({ titel: gv.g.titel, pt, verandering: gv.verandering });
    gv.melding = { soort: "top", tekst: `Goed! +${pt} ${pt === 1 ? "punt" : "punten"}.` + (gv.verandering ? " Deze oefening is nu beheerst." : pt === 2 && !v.beheerst ? ` Nog ${GR_NODIG - v.opRij} keer in één keer goed voor ‘beheerst’.` : "") };
    grBewaar(); grTeken();
  }
  function grOpgeven() {  // uitwerking bekeken zonder goed antwoord
    const v = grVg.g[gv.g.id];
    v.opRij = 0; v.gemist++; v.laatst = gr.nr;
    gr.uitslag.push({ titel: gv.g.titel, pt: 0, verandering: "" });
    grBewaar(); grVolgende();
  }
  function grVolgende() { if (gr.i < gr.lijst.length - 1) { gr.i++; grItem(); } else grEinde(); }

  function grTeken() {
    const { g, opg } = gv;
    const blok = [];
    if (opg.soort === "mc") {
      blok.push(h("div", { class: "opties" }, gv.volgorde.map((i) => {
        const gekozen = gv.gekozen.includes(i);
        const klasse = "optie" + (gekozen ? (i === opg.goed ? " goed" : " fout") : gv.opgelost && i === opg.goed ? " goed" : "");
        return h("button", { class: klasse, disabled: gv.opgelost || gekozen, onclick: () => grKies(i) }, opg.opties[i]);
      })));
    } else {
      const inp = h("input", { class: "getalinvoer", type: "text", inputmode: "decimal", value: gv.invoer, disabled: gv.opgelost, "aria-label": "antwoord",
        oninput: (e) => { gv.invoer = e.target.value; }, onkeydown: (e) => { if (e.key === "Enter") grControleerGetal(); } });
      blok.push(h("div", { class: "rij" }, inp, h("span", {}, opg.eenheid || ""),
        gv.opgelost ? null : h("button", { class: "knop", onclick: grControleerGetal }, "Controleer")));
    }
    if (gv.melding) blok.push(h("div", { class: "melding " + gv.melding.soort }, gv.melding.tekst));
    if (gv.uitleg) {
      const n = opg.uitleg.length;
      blok.push(h("div", { class: "melding info uitwerking" },
        h("b", {}, "Uitwerking"),
        h("ol", {}, opg.uitleg.slice(0, gv.uitStap).map((t) => h("li", {}, t))),
        gv.uitStap < n ? h("button", { class: "knop tweede", onclick: () => { gv.uitStap++; gv.uitStapGezien = true; grTeken(); } }, gv.uitStap === 0 ? "Toon de eerste stap" : "Volgende stap") : null,
        !gv.opgelost && gv.uitStap >= n ? h("div", { class: "klein", style: "margin-top:6px" }, "Pas je antwoord aan, of ga verder (0 punten; deze oefening komt terug).") : null));
    }
    const laatste = gr.i === gr.lijst.length - 1;
    if (gv.opgelost) blok.push(h("div", { class: "rij", style: "margin-top:10px" }, h("button", { class: "knop", onclick: grVolgende }, laatste ? "Bekijk je ronde" : "Volgende grafiek")));
    else if (gv.uitleg && gv.uitStap >= opg.uitleg.length) blok.push(h("div", { class: "rij", style: "margin-top:10px" }, h("button", { class: "knop tweede", onclick: grOpgeven }, laatste ? "Bekijk je ronde" : "Verder zonder punten")));

    $app.replaceChildren(
      kopGraf(),
      h("div", { class: "kaart" },
        h("div", { class: "rij", style: "justify-content:space-between" },
          h("div", { class: "rij" }, h("button", { class: "knop tweede klein-knop", onclick: grStart }, "← Overzicht"),
            h("span", { class: "stapinfo" }, `Grafiek ${gr.i + 1} van ${gr.lijst.length} · ${g.denkwijze}`)),
          h("div", { class: "klein" }, `Punten deze ronde: ${gr.punten}`)),
        h("h2", { style: "margin-top:8px" }, g.titel),
        h("div", { class: "context" }, opg.context),
        h("div", { class: "grafiekvak" }, grafiekSvg(opg.grafiek),
          opg.grafiek.series.some((r) => r.naam) ? h("div", { class: "legenda" }, opg.grafiek.series.filter((r) => r.naam).map((r) =>
            h("span", {}, h("span", { class: "legstip", style: `background:${r.kleur === "koraal" ? "#E4572E" : "#0F7C74"}` }), r.alleenPunten ? `${r.naam} (punten)` : `${r.naam} (lijn)`))) : null),
        h("h3", { style: "margin-top:12px" }, opg.vraag),
        blok));
    const inp = $app.querySelector(".getalinvoer"); if (inp && !gv.opgelost) inp.focus({ preventScroll: true });
  }

  function grEinde() {
    const max = gr.lijst.length * 2;
    const record = gr.punten > grVg.record; if (record) grVg.record = gr.punten;
    grBewaar();
    const b = grBeheerst(), n = grafieken.length, rest = n - b;
    const code = `${niveau === "havo" ? "H" : "V"} · grafieken · ronde ${gr.nr} · ${gr.punten}/${max} punten · beheerst ${b}/${n}`;
    $app.replaceChildren(
      kopGraf(),
      h("div", { class: "kaart" },
        h("h2", {}, `Ronde ${gr.nr} klaar: ${gr.punten} van ${max} punten`),
        record && gr.nr > 1 ? h("div", { class: "melding top" }, "Nieuw persoonlijk record!") : null,
        h("table", { class: "tabel" }, gr.uitslag.map((u) => h("tr", {}, h("td", {}, u.titel), h("td", {}, `${u.pt} ${u.pt === 1 ? "punt" : "punten"}`), h("td", { class: "omhoog" }, u.verandering === "beheerst" ? "✓ beheerst" : "")))),
        h("p", {}, rest === 0 ? "Alle grafiekoefeningen beheerst. Knap!" : `Nog ${rest} ${rest === 1 ? "oefening" : "oefeningen"} te gaan. De volgende ronde krijg je nieuwe grafieken met andere getallen.`),
        h("div", { class: "rij" },
          h("button", { class: "knop", onclick: grNieuweRonde }, "Nog een ronde"),
          h("button", { class: "knop tweede", onclick: grStart }, "Naar het overzicht"),
          vastOnderdeel ? null : h("button", { class: "knop tweede", onclick: menu }, "Menu")),
        h("div", { style: "margin-top:16px" }, h("div", { class: "klein" }, "Code voor Learnbeat (kopieer en plak bij de vraag onder deze oefening):"), h("div", { class: "code" }, code))));
  }

  // ---------- start ----------
  if (!set) { $app.textContent = "Geen oefenstof gevonden."; return; }
  if (niveau) { laadNiveau(niveau); naarStart(); } else niveauScherm();
})();
</script>
</body>
